<!DOCTYPE html>
<html>
<head>
    <title>TaskFlow</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            outline: none;
        }

        input:focus {
            border-color: #667eea;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #f8f9ff;
            padding: 10px;
            border-radius: 10px;
            margin-top: 10px;
        }

        .left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .done {
            text-decoration: line-through;
            color: gray;
        }

        .actions button {
            background: transparent;
            color: #555;
            font-size: 14px;
        }

        .actions button:hover {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>TaskFlow</h2>
        <div class="input-group">
            <input id="taskInput" placeholder="Add task...">
            <button onclick="addTask()">Add</button>
        </div>
        <div id="list"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
